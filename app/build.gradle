plugins { id 'com.android.application' }
android {
    namespace 'com.akv.irs'
    compileSdk 34
    defaultConfig { applicationId 'com.akv.irs'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'glb','gltf','mp3','ogg','wav','png','jpg' }
}
dependencies { implementation 'androidx.webkit:webkit:1.10.0' }
